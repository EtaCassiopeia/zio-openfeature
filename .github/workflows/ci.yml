name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force any JavaScript action still bundled with Node 20 to run on Node 24. Belt-and-suspenders for the few
# actions (sbt/setup-sbt@v1, …) that haven't bumped majors yet. Node 24 becomes the runner default on
# 2026-06-02 and Node 20 is removed entirely on 2026-09-16 — see #164.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Format check runs once; format errors are platform-independent so there's no value in re-running per matrix cell.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The four vendored gherkin files exist twice — once per conformance runner — and must stay
      # byte-identical. Unlike upstream drift (scheduled, see gherkin-drift.yml), breaking the
      # in-repo mirror is the PR author's doing, so it blocks here. Runs first: it needs no JDK, no
      # sbt and no network, so failing it early gives the signal in seconds rather than burying it
      # behind a multi-minute scalafmt run — which would mask it entirely whenever scalafmt fails.
      - name: Check vendored gherkin copies are in sync
        run: .github/scripts/check-gherkin-drift.sh mirror
      # The pin is machine-read from the conformance README (#336). Nothing else in CI executes that
      # parse: the scheduled drift job always passes an explicit ref (deliberately — it compares
      # against upstream main), so without this step a README edit that breaks the parse would
      # surface only on a developer's machine (#338). Parse-only — no JDK, no sbt, no network — so
      # it belongs up here beside the mirror check rather than behind the multi-minute sbt setup.
      - name: Check the gherkin pin parses from the README
        run: .github/scripts/check-gherkin-drift.sh print-pin
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll

  # Build + test on every supported (JDK, Scala) pair. The library advertises Java 11+ via the OpenFeature Java SDK
  # but we don't currently support running CI on JDK 11 because Optimizely's core-httpclient-impl requires JDK 17+;
  # JDK 17 (current LTS) and JDK 21 (next LTS) cover the realistic deployment window. Scala 2.13 + 3.3 matches the
  # crossScalaVersions declared in build.sbt.
  build-matrix:
    runs-on: ubuntu-latest
    # A test deadlock (e.g. a provider whose background poller is never reaped) would otherwise run to GitHub's
    # 6-hour default, leaving the run dangling `in_progress` and blocking the `build` gate. Tests complete in ~2-3
    # minutes; 20 turns a hang into a fast, diagnosable failure. See #212.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
        scala-version: ['2.13.16', '3.3.4']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Compile
        run: sbt "++${{ matrix.scala-version }} compile"
      - name: Run tests
        run: sbt "++${{ matrix.scala-version }} test"

  # Binary-compatibility check runs once on the primary JDK. mima checks bytecode, which is JDK-independent given a
  # single target bytecode level. `mimaPreviousArtifacts` baselines each module against its own `1.0.0` (see
  # `commonSettings` in build.sbt), and those artifacts are published on Maven Central — so this gate is LIVE: it
  # really does compare every PR against 1.0.0, and an accidental break fails here.
  #
  # One caveat when reading a green result: `ThisBuild / mimaFailOnNoPrevious := false` means a module with no
  # published baseline (a newly added one, before its first release) is skipped SILENTLY rather than failing. So
  # "mima green" is not by itself proof that a given module was compared — check `mimaPreviousArtifacts` resolves
  # for a new module when you add one.
  mima:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Check binary compatibility
        run: sbt +mimaReportBinaryIssues

  # Examples are not published artifacts but must compile so the README snippets and `examples/` reference code stay
  # honest. The testkit example additionally runs its spec (UserServiceSpec) — the canonical demonstration of the
  # testing story — so a public API change that breaks the documented usage fails CI instead of rotting silently.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Compile and test examples
        run: sbt "examplesOfrepInitTimeout/compile" "examplesTestkitApp/test" "examplesTypedFlags/compile"

  # Conformance runs the vendored OpenFeature gherkin suite via Cucumber. It is Scala 3 only and not aggregated by
  # root (so `++2.13.16 test` doesn't try to compile it), hence its own job on the primary JDK / default Scala.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Run conformance suite
        run: sbt conformance/test

  # The same OpenFeature gherkin suite run via zio-bdd (experimental dog-food). Scala 3 only and not aggregated by
  # root, so it gets its own job like `conformance`. Blocking gate: a zio-bdd RC bump that breaks the suite fails CI.
  conformance-zio-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Run zio-bdd conformance suite
        run: sbt conformanceZioBdd/test

  # Single aggregated check named `build` so the existing branch-protection rule on `main` (which requires a status
  # check named exactly "build") doesn't need updating every time we add or rename a matrix dimension. This job emits
  # one status per CI run that succeeds iff every upstream job succeeded — extend the `needs` list when adding jobs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [format, build-matrix, mima, examples, conformance, conformance-zio-bdd]
    if: always()
    steps:
      - name: Fail if any required check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required checks did not succeed: ${{ toJson(needs) }}" >&2
          exit 1
      - name: All required checks passed
        run: echo "format, build-matrix, mima, examples, conformance, conformance-zio-bdd all succeeded"
