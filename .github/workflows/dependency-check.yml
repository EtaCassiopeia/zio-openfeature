name: Dependency Check

on:
  schedule:
    - cron: '0 8 * * 1' # every Monday at 8am UTC
  workflow_dispatch:

# Force any JavaScript action still bundled with Node 20 to run on Node 24. See #164 / ci.yml note.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: sbt/setup-sbt@v1

      - name: Collect dependency JARs
        run: |
          set -eo pipefail
          # Every published module, not just core/testkit. The two that were scanned carry almost no
          # third-party surface (ZIO + the OpenFeature SDK), while extras/ofrep/optimizely carry the
          # transitive HTTP stacks — so this job was structurally unable to see the Jackson advisories
          # in ofrep and stayed green through all of them (#402).
          #
          # sbt writes to a file instead of straight into a pipe. A pipeline's exit status is its LAST
          # command's, so piping sbt into grep discards sbt's failure — and because sbt's batch mode
          # stops at the first failing `show` while everything printed before it is already through the
          # pipe, a failure on `ofrep` would leave a non-empty list of the earlier modules' jars and
          # scan green having skipped the very module this widening exists to cover.
          sbt 'show core/managedClasspath' 'show testkit/managedClasspath' \
              'show extras/managedClasspath' 'show ofrep/managedClasspath' \
              'show optimizely/managedClasspath' > /tmp/sbt-classpaths.txt
          grep -oP '/.+?\.jar' /tmp/sbt-classpaths.txt | sort -u > /tmp/dep-jars.txt || true
          # A silently empty list would make the scan below vacuously green — the exact failure mode
          # this widening exists to remove. Fail loudly instead.
          test -s /tmp/dep-jars.txt || { echo "::error::no dependency JARs resolved"; exit 1; }
          mkdir -p build/deps
          # No `2>/dev/null` here: a jar the scanner cannot copy is a jar it will not scan, and this
          # job must not report green on a partial corpus.
          while read jar; do cp "$jar" build/deps/; done < /tmp/dep-jars.txt
          # Count what actually landed, not what was listed — the two differ precisely when it matters.
          echo "Collected $(find build/deps -name '*.jar' | wc -l) dependency JARs"

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.dependency-check
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-

      - name: Install OWASP Dependency-Check
        run: |
          DC_VERSION=12.1.0
          curl -sL "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" -o /tmp/dc.zip
          unzip -q /tmp/dc.zip -d /opt

      - name: Run dependency check
        run: |
          /opt/dependency-check/bin/dependency-check.sh \
            --project zio-openfeature \
            --scan build/deps \
            --format HTML \
            --out build/reports \
            --data ~/.dependency-check \
            --nvdApiKey "$NVD_API_KEY" \
            --suppression dependency-check-suppressions.xml \
            --disableOssIndex \
            --failOnCVSS 7
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/
