name: Docs

# Builds the site on every PR (so a broken page, a dead link or a snippet that no longer compiles fails review) and
# deploys it from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Force any JavaScript action still bundled with Node 20 to run on Node 24. See #164 / ci.yml note.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # The pages include their code from examples/docs, so compile it and run its checks before publishing it
      # The rift code on the real-providers page lives in provider-fault-tests: compile it here, never run it (#470)
      - name: Compile and test the documented code
        run: sbt examplesDocs/test providerFaultTests/Test/compile
      - name: Check the animations are up to date
        run: |
          python3 scripts/visuals/build.py
          git diff --exit-code -- docs/assets || { echo "Run python3 scripts/visuals/build.py and commit the result" >&2; exit 1; }
      - name: Build the site
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
