name: Formal model

# TLC checks the provider-lifecycle model (formal/lifecycle) on every change to it and to the lifecycle code it models.
# A pull request that changes the lifecycle code without changing the model says why in its description. TLC also checks
# the recovery properties under fairness (Liveness.cfg), an evaluation's re-check against swaps (Evaluation.cfg), and
# that a provider's silent death stays reachable and unreported (witness.py). On main and on demand, the mutants also
# run: each fixed lifecycle bug, each evaluation bug and each progress bug is put back into the model and must be
# caught.
# TLAPS proves the lifecycle model's structural invariants for all sizes (LifecycleProofs.tla).
# The event lane model (formal/lane) checks OrderedEmitter against the SDK's API lock, with its witnesses and mutants.
# Trace validation checks that runs of the library are behaviours of the model: on pull requests the checker's own
# fixtures, on main, nightly and on demand also the runs the lifecycle test suites record.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
      - 'core/src/main/scala/zio/openfeature/FeatureFlagsLive.scala'
      - 'core/src/main/scala/zio/openfeature/internal/EventBridge.scala'
      - 'core/src/main/scala/zio/openfeature/internal/Evaluator.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ProviderRegistration.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ProviderStatusMachine.scala'
      - 'core/src/main/scala/zio/openfeature/internal/OrphanedProviders.scala'
      - 'core/src/main/scala/zio/openfeature/internal/SwitchableProvider.scala'
      - 'core/src/main/scala/zio/openfeature/internal/FeatureFlagsFactories.scala'
      - 'core/src/main/scala/zio/openfeature/internal/LifecycleProbe.scala'
      - 'core/src/main/scala/zio/openfeature/internal/OrderedEmitter.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ManagedProvider.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/TraceProbe.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/LifecycleModelSpec.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/LifecycleInterleavingSpec.scala'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - '.github/workflows/formal.yml'
      - 'core/src/main/scala/zio/openfeature/FeatureFlagsLive.scala'
      - 'core/src/main/scala/zio/openfeature/internal/EventBridge.scala'
      - 'core/src/main/scala/zio/openfeature/internal/Evaluator.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ProviderRegistration.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ProviderStatusMachine.scala'
      - 'core/src/main/scala/zio/openfeature/internal/OrphanedProviders.scala'
      - 'core/src/main/scala/zio/openfeature/internal/SwitchableProvider.scala'
      - 'core/src/main/scala/zio/openfeature/internal/FeatureFlagsFactories.scala'
      - 'core/src/main/scala/zio/openfeature/internal/LifecycleProbe.scala'
      - 'core/src/main/scala/zio/openfeature/internal/OrderedEmitter.scala'
      - 'core/src/main/scala/zio/openfeature/internal/ManagedProvider.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/TraceProbe.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/LifecycleModelSpec.scala'
      - 'testkit/src/test/scala/zio/openfeature/testkit/LifecycleInterleavingSpec.scala'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  # Trace validation reads the traces with the community modules' Json, which needs TLC 1.8. Upstream has no
  # immutable 1.8 artifact: it re-publishes the v1.8.0 prerelease asset on every build, and Central purges its
  # 1.8.0-SNAPSHOT builds after about 90 days. So the jar comes from this repository's own prerelease, a mirror of
  # one verified build. Its release notes give the provenance: upstream commit, Central build and verification.
  # To move to a newer build: verify its distribution jar with `validate.py --selftest traces` and
  # `preconditions.py`, publish it as a new `tooling/tla2tools-<version>` prerelease, and change both lines below.
  # Never overwrite a published asset. Put the prerelease's tag on a parentless anchor commit, never on a commit of
  # main: the build derives its version from tags.
  TRACE_TLA_TOOLS_RELEASE: tooling/tla2tools-1.8.0-20261102.144740-119
  TRACE_TLA_TOOLS_SHA256: 8f719a6126a0922cf5a243f6c0ce73193b5c2e0a4e4cd29288ecc57a547f629d
  # TLAPS for the proofs (LifecycleProofs.tla). 1.6.0-pre is a prerelease upstream can re-publish; when the check below
  # fails, run the proofs with the new tarball and re-pin. Pinned to the asset uploaded 2026-11-01T14:28Z (tlapm 9ed0376).
  TLAPM_VERSION: 1.6.0-pre
  TLAPM_SHA256: 39620b869ed939d991f5e2c4d604d84d16c05c5dd95787a1e5f47da296746b7b
  COMMUNITY_MODULES_VERSION: '202610262215'
  COMMUNITY_MODULES_SHA256: 1c77d512e73ae9fde27103bee9115898fc9d62bea3a99313aeb5eb14c6284af6

jobs:
  tlc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download the TLA+ tools
        run: |
          curl -sSLo tla2tools.jar "https://github.com/tlaplus/tlaplus/releases/download/${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  tla2tools.jar" | sha256sum -c -
      - name: Check the lifecycle model
        working-directory: formal/lifecycle
        run: java -XX:+UseParallelGC -cp ../../tla2tools.jar tlc2.TLC -workers auto -deadlock -config Lifecycle.cfg Lifecycle.tla
      # Recovery: the temporal properties under FairSpec, on Liveness.cfg's small bounds and without symmetry, which
      # TLC's liveness checking does not support soundly.
      - name: Check the lifecycle model's recovery properties
        working-directory: formal/lifecycle
        run: java -XX:+UseParallelGC -cp ../../tla2tools.jar tlc2.TLC -workers auto -config Liveness.cfg Lifecycle.tla
      # Evaluation: Evaluator.gated's re-check against swaps, with one evaluation on small bounds (Evaluation.cfg).
      - name: Check the lifecycle model with an evaluation
        working-directory: formal/lifecycle
        run: java -XX:+UseParallelGC -cp ../../tla2tools.jar tlc2.TLC -workers auto -deadlock -config Evaluation.cfg Lifecycle.tla
      # The silent-death witness: with AllowDeath every invariant still holds, and the instance can report Ready while its
      # provider has silently died. A change that makes that unreachable fails here, and the README must change with it.
      - name: Check that a silently dead provider can be reported Ready
        working-directory: formal/lifecycle
        run: python3 witness.py ../../tla2tools.jar
      # The event lane (formal/lane): the checked-in translation must match the PlusCal, then ordering, deadlock freedom
      # and no dropped emission (Lane.cfg), the documented limits (witness.py) and the bugs the lane's design excludes
      # (mutants.py). A few minutes in all, so on every pull request.
      - name: Check the event lane model
        working-directory: formal/lane
        run: |
          java -cp ../../tla2tools.jar pcal.trans -nocfg Lane.tla
          rm -f Lane.old
          git diff --exit-code -- Lane.tla
          java -XX:+UseParallelGC -cp ../../tla2tools.jar tlc2.TLC -workers auto -config Lane.cfg Lane.tla
          python3 witness.py ../../tla2tools.jar
          python3 mutants.py ../../tla2tools.jar
      - name: Check that the model catches each fixed lifecycle bug and each progress bug
        if: github.event_name != 'pull_request'
        working-directory: formal/lifecycle
        run: python3 mutants.py ../../tla2tools.jar

  # The structural invariants, proved for any number of providers, swaps, events and evaluations.
  proofs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download TLAPS
        run: |
          curl -sSfLo tlapm.tar.gz "https://github.com/tlaplus/tlapm/releases/download/${TLAPM_VERSION}/tlapm-${TLAPM_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${TLAPM_SHA256}  tlapm.tar.gz" | sha256sum -c -
          tar xzf tlapm.tar.gz
      - name: Check the lifecycle model's proofs
        working-directory: formal/lifecycle
        run: ../../tlapm/bin/tlapm --cleanfp LifecycleProofs.tla

  traces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Set up sbt
        if: github.event_name != 'pull_request'
        uses: sbt/setup-sbt@v1
      - name: Download the TLA+ tools and community modules
        run: |
          curl -sSfLo tla2tools.jar "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TRACE_TLA_TOOLS_RELEASE}/tla2tools.jar"
          echo "${TRACE_TLA_TOOLS_SHA256}  tla2tools.jar" | sha256sum -c -
          curl -sSLo CommunityModules-deps.jar "https://github.com/tlaplus/CommunityModules/releases/download/${COMMUNITY_MODULES_VERSION}/CommunityModules-deps.jar"
          echo "${COMMUNITY_MODULES_SHA256}  CommunityModules-deps.jar" | sha256sum -c -
      - name: Check that the checker accepts and rejects its fixtures
        working-directory: formal/lifecycle
        run: python3 validate.py ../../tla2tools.jar ../../CommunityModules-deps.jar --selftest traces
      - name: Check that each library precondition is exercised by a fixture
        working-directory: formal/lifecycle
        run: python3 preconditions.py ../../tla2tools.jar ../../CommunityModules-deps.jar
      - name: Record the lifecycle test suites' runs
        if: github.event_name != 'pull_request'
        env:
          ZOF_TRACE: '1'
          ZOF_TRACE_DIR: ${{ github.workspace }}/traces
        run: sbt "testkit/testOnly zio.openfeature.testkit.LifecycleModelSpec zio.openfeature.testkit.LifecycleInterleavingSpec"
      - name: Check every recorded run is a behaviour of the model
        if: github.event_name != 'pull_request'
        working-directory: formal/lifecycle
        run: python3 validate.py ../../tla2tools.jar ../../CommunityModules-deps.jar "${GITHUB_WORKSPACE}/traces"
      - name: Keep the recorded runs
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-traces
          path: traces/
          retention-days: 14

  # A lifecycle change without a model change is fine when it does not affect the protocol, but the author says so.
  model-or-reason:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a model change or a stated reason
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          lifecycle=$(printf '%s\n' "$changed" | grep -E '^core/src/main/scala/zio/openfeature/(FeatureFlagsLive|internal/(EventBridge|ProviderRegistration|ProviderStatusMachine|OrphanedProviders|SwitchableProvider|FeatureFlagsFactories))\.scala$' || true)
          model=$(printf '%s\n' "$changed" | grep -E '^formal/' || true)
          if [ -z "$lifecycle" ] || [ -n "$model" ]; then
            echo "Nothing to check: no lifecycle file changed, or the model changed with it."
            exit 0
          fi
          if printf '%s\n' "$BODY" | grep -qiE '^formal: unaffected because .+'; then
            echo "The description states why the model is unaffected."
            exit 0
          fi
          echo "::error::This pull request changes the lifecycle code without changing formal/lifecycle:"
          printf '%s\n' "$lifecycle"
          echo "::error::Update the model, or add a line to the description: 'formal: unaffected because <reason>'."
          exit 1
