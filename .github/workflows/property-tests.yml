name: Property tests

# Nightly deep run of every property test: each test tagged `property` (through the shared `PropertyBudget` aspect)
# runs with its sample count multiplied by ZOF_PBT_SCALE and a fresh random seed. PR CI runs the same tests at their
# base counts and zio-test's fixed seed. Not a PR gate. The seed is printed in the job summary: replay a failure with
# `ZOF_PBT_SCALE=10 ZOF_PBT_SEED=<seed> sbt "<module>/testOnly -- -tags property"`, then check the shrunk case in as an
# explicit regression example (seeds are not stable across zio-test versions).

on:
  schedule:
    # Every night at 04:00 UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: Sample multiplier
        default: "10"
      seed:
        description: Random seed (empty for a fresh one)
        default: ""

permissions:
  contents: read

# Force any JavaScript action still bundled with Node 20 to run on Node 24 (see ci.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  property:
    name: property (${{ matrix.module }})
    runs-on: ubuntu-latest
    # The heaviest module (the lifecycle model) runs about ten minutes at 10x; this bound only catches a wedged runner.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: [core, extras, testkit, ofrep, optimizely]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Pick the scale and seed
        id: budget
        shell: bash
        env:
          INPUT_SCALE: ${{ github.event.inputs.scale }}
          INPUT_SEED: ${{ github.event.inputs.seed }}
        run: |
          scale="${INPUT_SCALE:-10}"
          seed="${INPUT_SEED:-$(( (RANDOM << 30) ^ (RANDOM << 15) ^ RANDOM ))}"
          echo "scale=$scale" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          {
            echo "## Property tests (${{ matrix.module }})"
            echo
            echo "- scale: $scale, seed: \`$seed\`"
            echo "- replay: \`ZOF_PBT_SCALE=$scale ZOF_PBT_SEED=$seed sbt \"${{ matrix.module }}/testOnly -- -tags property\"\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the property tests
        env:
          ZOF_PBT_SCALE: ${{ steps.budget.outputs.scale }}
          ZOF_PBT_SEED: ${{ steps.budget.outputs.seed }}
        run: sbt "${{ matrix.module }}/testOnly -- -tags property"
