name: Property tests

# Scheduled long run of the lifecycle model-based property test (#464). PR CI runs 25 generated sequences; this runs
# 300, to reach rarer interleavings of swaps, provider events, shutdown and interrupts. Not a PR gate. A failure
# prints the shrunk sequence: check it in as an explicit example in the spec's `regressions` suite.

on:
  schedule:
    # Sundays 05:00 UTC, after the mutation run.
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Force any JavaScript action still bundled with Node 20 to run on Node 24 (see ci.yml, #164).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lifecycle-model:
    runs-on: ubuntu-latest
    # Each sequence takes a few seconds at most (a hung swap gives up at the spec's 2 s init timeout); this bound only
    # catches a wedged runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Run the lifecycle model with 300 sequences
        env:
          LIFECYCLE_MODEL_SAMPLES: "300"
        run: sbt "testkit/testOnly *LifecycleModelSpec"
