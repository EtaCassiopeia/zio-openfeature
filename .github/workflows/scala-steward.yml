name: Scala Steward

# Scala Steward opens PRs to update sbt/Scala dependencies (the scala-version, plugins, and library
# dependencies in build.sbt / project/*), which Dependabot cannot do. It runs on a schedule and can be
# triggered manually; it never runs on pull_request, so it is not part of the CI merge gate.
#
# It authenticates with the SCALA_STEWARD_TOKEN secret: a fine-grained personal access token scoped to this
# repository (Contents and Pull requests read/write, Metadata read). The built-in GITHUB_TOKEN does not work here:
# this repo does not allow GitHub Actions to create pull requests (every run failed with a 403, #473), and a PR
# opened by GITHUB_TOKEN would not trigger CI anyway. Version pins live in .scala-steward.conf.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.SCALA_STEWARD_TOKEN }}
