name: Publish Snapshot

# Publishes a `-SNAPSHOT` to the Sonatype Central snapshots repository after CI passes on `main`, so consumers can
# track unreleased changes between tagged releases. Tagged (real) publishing stays in release.yml. Triggered on a
# *successful* CI run rather than the raw push, so a red commit never publishes a snapshot and the test suite is not
# run twice (CI already gated the commit); a manual `workflow_dispatch` is provided for on-demand snapshots.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Force any JavaScript action still bundled with Node 20 to run on Node 24. See #164 / ci.yml note.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One in-flight snapshot publish at a time; a newer main commit supersedes an older queued one.
concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish-snapshot:
    # workflow_run: only when the CI run succeeded. workflow_dispatch: always (manual override).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so sbt-dynver derives the correct `x.y.z+N-<sha>-SNAPSHOT` version. Check out the exact
          # commit CI validated (`workflow_run` exposes its head SHA); fall back to the ref for manual dispatch.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Publish snapshot to Sonatype Central
        # `sbt ci-release` detects the `-SNAPSHOT` version (this commit carries no `v*` tag) and publishes to the
        # Central snapshots repository; the identical command publishes a real release from release.yml on a tag.
        #
        # `ci-release` returns 0 on all of its "doing nothing" paths — no secrets, a non-SNAPSHOT version, or (before
        # sbt-ci-release 1.12.0 / sbt 1.11) "Sonatype Central does not accept snapshots ... Aborting release." That is
        # how this workflow reported success on every run while never uploading a single artifact. So don't trust the
        # exit code alone: require the log line that only the snapshot branch prints.
        run: |
          set -o pipefail
          echo "PUBLISH_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
          sbt ci-release 2>&1 | tee ci-release.log
          grep -q 'No tag push, publishing SNAPSHOT' ci-release.log \
            || { echo "::error::ci-release exited 0 without taking the snapshot path — nothing was published"; exit 1; }
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Verify the snapshot reached the repository
        # End-to-end check that artifacts actually landed where the README tells consumers to look. Checking only that
        # the metadata *exists* would stay green forever after the first successful publish, so compare its
        # `lastUpdated` against the moment this run started publishing: a run that uploaded nothing leaves a stale
        # timestamp behind. The 5-minute slack absorbs clock skew between the runner and Sonatype.
        run: |
          meta=https://central.sonatype.com/repository/maven-snapshots/io/github/etacassiopeia/zio-openfeature-core_3/maven-metadata.xml
          curl -fsS "$meta" -o maven-metadata.xml \
            || { echo "::error::no snapshot metadata on Central — the publish did not reach the repository"; exit 1; }
          stamp=$(grep -oE '<lastUpdated>[0-9]+</lastUpdated>' maven-metadata.xml | grep -oE '[0-9]+')
          [ -n "$stamp" ] || { echo "::error::snapshot metadata has no <lastUpdated>"; exit 1; }
          [ -n "${PUBLISH_STARTED_AT:-}" ] || { echo "::error::PUBLISH_STARTED_AT unset — cannot judge freshness"; exit 1; }
          updated=$(date -u -d "${stamp:0:4}-${stamp:4:2}-${stamp:6:2} ${stamp:8:2}:${stamp:10:2}:${stamp:12:2}" +%s)
          if [ "$updated" -lt "$((PUBLISH_STARTED_AT - 300))" ]; then
            echo "::error::snapshot metadata was last updated $stamp, before this run started — nothing was published"
            exit 1
          fi
          echo "Snapshot metadata updated at $stamp:"
          grep -E '<version>|<latest>' maven-metadata.xml | tail -5
