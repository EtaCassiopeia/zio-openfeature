version = "3.7.17"
runner.dialect = scala3
maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
align.preset = more
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true

fileOverride {
  "glob:**/scala-2/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  "glob:**/src/main/scala/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  "glob:**/src/test/scala/**" {
    runner.dialect = scala213
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  // sbt compiles build files with Scala 2.12, so the Scala 3 dialect must not reach them: its
  // rewrites turn `x match { case ... }` braceless and `import a._` into `a.*`, neither of which
  // 2.12 parses, and the project then fails to load at all. `scalafmtCheckAll` covers `src/**`
  // only, so nothing else catches it — CI runs `scalafmtSbtCheck` for that. See #381.
  //
  // `**/*.sbt` is the entry that matters today: it covers `build.sbt` and `project/plugins.sbt`,
  // and no other glob here competes for a `.sbt` file. `**/project/**.scala` exists for build
  // sources that do not exist yet (there are none right now).
  //
  // Both are deliberately LAST. scalafmt matches these globs against the file's *absolute* path
  // and takes the first entry that matches, so an unanchored `project` segment anywhere above the
  // repo — a clone at `~/project/zio-openfeature` — would otherwise capture the whole source tree
  // and repin it to 2.12 on that machine only. Ordering them after the `src/**` entries means the
  // source rules win that race.
  "glob:**/*.sbt" {
    runner.dialect = scala212
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
  "glob:**/project/**.scala" {
    runner.dialect = scala212
    rewrite.scala3.convertToNewSyntax = false
    rewrite.scala3.removeOptionalBraces = false
  }
}
