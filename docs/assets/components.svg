<rect x="28.0" y="104" width="196" height="300" rx="10" fill="url(#panel)" stroke="#334155"/><text x="126" y="96" class="tiny" text-anchor="middle">YOUR CODE</text><text x="126" y="136" class="tag" text-anchor="middle" fill="#e2e8f0">fiber</text><text x="126" y="152" class="hud" text-anchor="middle">FeatureFlags.boolean</text><text x="126" y="320" class="tag" text-anchor="middle" fill="#e2e8f0">stream</text><text x="126" y="336" class="hud" text-anchor="middle">FeatureFlags.events</text><text x="126" y="380" class="tag" text-anchor="middle" fill="#e2e8f0">handler</text><text x="126" y="396" class="hud" text-anchor="middle">onConfigurationChanged</text><rect x="277.0" y="104" width="230" height="300" rx="10" fill="url(#panel)" stroke="#334155"/><text x="392" y="96" class="tiny" text-anchor="middle">FEATUREFLAGS (ZIO)</text><text x="392" y="136" class="tag" text-anchor="middle" fill="#e2e8f0">context · hooks · transaction</text><text x="392" y="152" class="hud" text-anchor="middle">Ref + FiberRef</text><text x="392" y="206" class="tag" text-anchor="middle" fill="#e2e8f0">status gate</text><text x="392" y="320" class="tag" text-anchor="middle" fill="#e2e8f0">status machine</text><text x="392" y="336" class="hud" text-anchor="middle">Ready · Stale · Error · Fatal</text><text x="392" y="380" class="tag" text-anchor="middle" fill="#e2e8f0">event hub</text><text x="392" y="396" class="hud" text-anchor="middle">sliding, 256 events</text><rect x="561.0" y="104" width="170" height="300" rx="10" fill="url(#panel)" stroke="#334155"/><text x="646" y="96" class="tiny" text-anchor="middle">OPENFEATURE SDK</text><text x="646" y="136" class="tag" text-anchor="middle" fill="#e2e8f0">Client</text><text x="646" y="152" class="hud" text-anchor="middle">get*Details</text><text x="646" y="320" class="tag" text-anchor="middle" fill="#e2e8f0">event dispatch</text><text x="646" y="336" class="hud" text-anchor="middle">SDK threads</text><rect x="791.0" y="104" width="130" height="300" rx="10" fill="url(#panel)" stroke="#334155"/><text x="856" y="96" class="tiny" text-anchor="middle">PROVIDER</text><text x="856" y="136" class="tag" text-anchor="middle" fill="#e2e8f0">evaluate</text><text x="856" y="320" class="tag" text-anchor="middle" fill="#e2e8f0">emit events</text><line x1="224" y1="176" x2="786" y2="176" class="rail"/><line x1="224" y1="176" x2="786" y2="176" class="flow" stroke="#60a5fa"/><line x1="224" y1="350" x2="786" y2="350" class="rail"/><line x1="224" y1="350" x2="786" y2="350" class="flow" stroke="#e879f9"/><g style=""><rect x="582" y="193" width="179.20000000000002" height="18" rx="4" fill="#60a5fa" fill-opacity="0.14" stroke="#60a5fa" stroke-opacity="0.6"/><text x="671.6" y="206" class="badge" text-anchor="middle" fill="#60a5fa">blocking pool · timeout</text></g><g style="animation:k1 12.0s ease-in-out infinite;"><rect x="-36.0" y="-10" width="72" height="20" rx="4" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#22d3ee">checkout</text></g><circle cx="856" cy="176" r="16" fill="none" stroke="#22d3ee" stroke-width="2" class="pulse" style="animation:k2 12.0s linear infinite;"/><g style="animation:k3 12.0s ease-in-out infinite;"><rect x="-22.0" y="-10" width="44" height="20" rx="4" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#34d399">true</text></g><g style="animation:k4 12.0s ease-in-out infinite;"><rect x="-29.0" y="-10" width="58" height="20" rx="4" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#22d3ee">banner</text></g><circle cx="856" cy="176" r="16" fill="none" stroke="#22d3ee" stroke-width="2" class="pulse" style="animation:k5 12.0s linear infinite;"/><g style="animation:k6 12.0s ease-in-out infinite;"><rect x="-29.0" y="-10" w