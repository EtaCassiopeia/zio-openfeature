<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Six context levels merge into the one context the provider sees: each level adds its attributes in turn, a higher level replaces the plan set by a lower one, and a before hook's addition lands last.">
<defs>
