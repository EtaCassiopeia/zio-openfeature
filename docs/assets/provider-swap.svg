<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 470" width="1190" height="470" role="img" aria-label="setProvider: the status moves from Ready to NotReady while the new provider initializes, and evaluations fail with ProviderNotReady. If initialize succeeds the new provider serves and the status is Ready (or Stale if the provider reports stale); if it throws, the old provider is restored and the status returns to Ready; if it times out, the new provider stays registered and the status is Error.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0b1222"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
  </linearGradient>
</defs>
