<text x="28" y="88" class="tiny" text-anchor="start">YOUR APP</text><text x="270" y="88" class="tiny" text-anchor="start">REAL PROVIDER</text><text x="500" y="88" class="tiny" text-anchor="start">RIFT INTERCEPT PROXY</text><text x="860" y="88" class="tiny" text-anchor="start">RULES</text><rect x="28" y="104" width="170" height="210" rx="10" fill="url(#panel)" stroke="#334155"/><rect x="270" y="104" width="170" height="210" rx="10" fill="url(#panel)" stroke="#334155"/><rect x="500" y="104" width="150" height="210" rx="10" fill="url(#panel)" stroke="#334155"/><text x="42" y="130" class="big" text-anchor="start">FeatureFlags</text><text x="42" y="150" class="hud" text-anchor="start">fromAcquireAsync</text><text x="42" y="178" class="tiny" text-anchor="start">ANSWERS · FALLBACK</text><text x="284" y="130" class="big" text-anchor="start">vendor SDK</text><text x="284" y="150" class="hud" text-anchor="start">HTTP client · TLS</text><text x="514" y="130" class="big" text-anchor="start">TLS-MITM</text><text x="514" y="150" class="hud" text-anchor="start">rule per host</text><line x1="650" y1="150" x2="860" y2="150" class="rail"/><line x1="650" y1="150" x2="860" y2="150" class="flow" stroke="#f87171"/><line x1="650" y1="270" x2="860" y2="270" class="rail"/><line x1="650" y1="270" x2="860" y2="270" class="flow" stroke="#fbbf24"/><rect x="860" y="124" width="172" height="52" rx="10" fill="url(#panel)" stroke="#334155"/><text x="872" y="146" class="tag" text-anchor="start" fill="#f87171">serve(...)</text><text x="872" y="164" class="hud" text-anchor="start">status 401</text><rect x="860" y="244" width="172" height="52" rx="10" fill="url(#panel)" stroke="#334155"/><text x="872" y="266" class="tag" text-anchor="start" fill="#fbbf24">redirectTo(imposter)</text><text x="872" y="284" class="hud" text-anchor="start">reply .after(30 s)</text><g style="animation:k1 12.0s ease-in-out infinite;"><rect x="-48.0" y="-10" width="96" height="20" rx="4" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#60a5fa">GET /datafile</text></g><circle cx="860" cy="150" r="12" fill="none" stroke="#f87171" stroke-width="2" class="pulse" style="animation:k2 12.0s linear infinite;"/><g style="animation:k3 12.0s ease-in-out infinite;"><rect x="-20.0" y="-10" width="40" height="20" rx="4" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#f87171">401</text></g><g style="animation:k4 12.0s linear infinite;"><rect x="284" y="175" width="90.4" height="18" rx="4" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.6"/><text x="329.2" y="188" class="badge" text-anchor="middle" fill="#f87171">never ready</text></g><g style="animation:k5 12.0s ease-in-out infinite;"><rect x="-48.0" y="-10" width="96" height="20" rx="4" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#60a5fa">GET /datafile</text></g><text x="802" y="300" class="hud" text-anchor="middle" fill="#fbbf24" style="animation:k6 12.0s linear infinite;">waiting…</text><g style="animation:k7 12.0s linear infinite;"><rect x="284" y="175" width="60.800000000000004" height="18" rx="4" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.6"/><text x="314.4" y="188" class="badge" text-anchor="middle" fill="#fbbf24">stalled</text></g><g style="animation:k8 12.0s ease-in-out infinite;"><rect x="-36.0" y="-10" width="72" height="20" rx="4" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#22d3ee">my-flag?</text></g><text x="42" y="200" class="log" style="animation:k9 12.0s linear infinite;"><tspan fill="#64748b">my-flag →</tspan> <tspan fill="#34d399">true</tspan></text><g style="animation:k10 12.