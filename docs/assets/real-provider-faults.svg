<rect width="1060" height="400" rx="14" fill="url(#grid)" opacity=".55"/>
<rect x=".75" y=".75" width="1058.5" height="398.5" rx="14" fill="none" stroke="#1e3a5f"/>
<text x="28" y="40" class="title">Testing a real provider</text>
<text x="1032" y="40" class="hud" text-anchor="end">vendor SDK → rift intercept proxy → your rules</text>
