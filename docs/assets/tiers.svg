<text x="28" y="40" class="title">Two tiers, one evaluation</text>
<text x="1072" y="40" class="hud" text-anchor="end">flag "dark-mode" is not defined in the provider</text>
<line x1="28" y1="58" x2="1072" y2="58" stroke="#1e293b"/>
<text x="28" y="88" class="tiny" text-anchor="start">CALLER</text><text x="470" y="88" class="tiny" text-anchor="start">SAME EVALUATION PATH</text><text x="930" y="88" class="tiny" text-anchor="middle">PROVIDER</text><text x="28" y="124" class="key" text-anchor="start" fill="#22d3ee">boolean("dark-mode", false)</text><text x="28" y="143" class="mode" text-anchor="start" fill="#64748b">typed tier · IO[FeatureFlagError, Boolean]</text><text x="28" y="258" class="key" text-anchor="start" fill="#e879f9">booleanOrDefault("dark-mode", false)</text><text x="28" y="277" class="mode" text-anchor="start" fill="#64748b">total tier · UIO[Boolean]</text><rect x="470" y="161.0" width="210" height="68" rx="10" fill="url(#panel)" stroke="#334155"/><text x="575.0" y="189.0" class="hud" text-anchor="middle">context · hooks · timeout</text><text x="575.0" y="209.0" class="hud" text-anchor="middle">→ provider call</text><line x1="680" y1="195.0" x2="900" y2="195.0" class="rail"/><line x1="680" y1="195.0" x2="900" y2="195.0" class="flow" stroke="#22d3ee"/><rect x="900" y="104" width="60" height="206" rx="10" fill="url(#panel)" stroke="#334155"/><text x="930" y="155.0" class="tiny" text-anchor="middle">resolve</text><g style="animation:k1 12.0s ease-in-out infinite;"><rect x="-39.0" y="-10" width="78" height="20" rx="4" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#22d3ee">dark-mode</text></g><g style="animation:k2 12.0s ease-in-out infinite;"><rect x="-39.0" y="-10" width="78" height="20" rx="4" fill="#e879f9" fill-opacity="0.18" stroke="#e879f9" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#e879f9">dark-mode</text></g><g style="animation:k3 12.0s linear infinite;"><rect x="-39.0" y="-10" width="78" height="20" rx="4" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#22d3ee">dark-mode</text></g><circle cx="930" cy="195.0" r="18" fill="none" stroke="#fbbf24" stroke-width="2" class="pulse" style="animation:k4 12.0s linear infinite;"/><g style="animation:k5 12.0s linear infinite;"><rect x="-56.0" y="-10" width="112" height="20" rx="4" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#fbbf24">FLAG_NOT_FOUND</text></g><g style="animation:k6 12.0s ease-in-out infinite;"><rect x="-50.0" y="-10" width="100" height="20" rx="4" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#f87171">FlagNotFound</text></g><g style="animation:k7 12.0s ease-in-out infinite;"><rect x="-30.0" y="-10" width="60" height="20" rx="4" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#34d399">false</text></g><text x="504" y="132" class="tag" text-anchor="start" fill="#f87171" style="animation:k8 12.0s linear infinite;">fails: no value</text><g style="animation:k9 12.0s linear infinite;"><rect x="28" y="161" width="364.20000000000005" height="18" rx="4" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.6"/><text x="210.10000000000002" y="174" class="badge" text-anchor="middle" fill="#f87171">Fail(FeatureFlagError.FlagNotFound("dark-mode"))</text></g><text x="484" y="266" class="tag" text-anchor="start" fill="#34d399" style="animation:k10 12.0s linear infinite;">serves the default</text><g style="animation:k11 12.0s linear infinite;"><rect x="28" y="295" width="327.2" height="18" rx="4" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/><text x="191.6" y="308" class="badge" text-anchor="middle" fill="#34d399">reason = ERROR · errorCode = FLAG_NOT_FOUND</text></g><rect x="28" y="336" width="1044" height="34" rx="10" fill="#070b16" stroke="#1e293b"/><text x="42" y="358" class="log" style="animation:k12 12.0s linear infinite;"><tspan fill="#fbbf24">WARN</tspan>  <tspan fill="#64748b">Flag 'dark-mode' fell back to its default false (FlagNotFound: Flag 'dark-mode' not found)</tspan></text>
<line x1="28" y1="390" x2="1072" y2="390" stroke="#1e293b"/>
<text x="28" y="416" class="hud">the typed tier reports why it could not read the flag; the total tier serves your default and says why</text>
