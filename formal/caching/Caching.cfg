\* Every interleaving of three evaluations and one configuration change.  Three callers are what a retry through the
\* shared cache needs to be answered by another caller's failure.  TLC's deadlock check stays on.
CONSTANTS
    MaxCallers = 3
    MaxChanges = 1

SPECIFICATION Spec

INVARIANTS
    NoStaleAfterInvalidate
    NoCachedFailure
    JoinersGetARun
