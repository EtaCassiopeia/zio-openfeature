\* The safety properties, with enough calls to open by failure count and recover through two probes.  Run with -deadlock:
\* once the budgets are spent, every caller waits at CArrive.
CONSTANTS
    Callers = {c1, c2}
    Signals = {s1}
    FailureThreshold = 2
    HalfOpenMaxCalls = 2
    MaxCalls = 5
    MaxDeaths = 1
    MaxSignals = 1

SPECIFICATION Spec

INVARIANTS
    AtMostOneProbe
    StaleOutcomeIgnored
    StaleFlag

PROPERTIES
    ReasonRespected
