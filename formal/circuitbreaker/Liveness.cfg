\* The slot-freeing property under the processes' fairness, on small bounds: enough deaths that a probe which takes over
\* a dead probe's slot can die in turn.  Run with -deadlock, as CircuitBreaker.cfg.
CONSTANTS
    Callers = {c1, c2}
    Signals = {s1}
    FailureThreshold = 1
    HalfOpenMaxCalls = 2
    MaxCalls = 2
    MaxDeaths = 2
    MaxSignals = 1

SPECIFICATION Spec

PROPERTIES
    SlotFreed
