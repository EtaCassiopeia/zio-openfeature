\* The safety properties with two signals racing each other and the callers: an event thread and a poll, for the trip
\* rules that take two trips.  Fewer calls, since each pair of signals multiplies the state space.  Run with -deadlock.
CONSTANTS
    Callers = {c1, c2}
    Signals = {s1, s2}
    FailureThreshold = 1
    HalfOpenMaxCalls = 2
    MaxCalls = 2
    MaxDeaths = 1
    MaxSignals = 2

SPECIFICATION Spec

INVARIANTS
    AtMostOneProbe
    StaleOutcomeIgnored
    StaleFlag

PROPERTIES
    ReasonRespected
