\* The documented limit under setProviderAndWait, which the library never calls: it holds the write lock across the old
\* provider's shutdown, whose close() then finds the lane stalled on the read lock and cuts its queue off at the bound.
\* witness.py requires NoDrop violated here, and nothing else.
CONSTANTS
    N = 3
    DelegateAwaits = FALSE
    LibraryCallsSetProviderAndWait = TRUE
    InitAwaitsEmission = FALSE

SPECIFICATION Spec

INVARIANTS
    SlotOrderFollowsReceipt
    ForwardNeverBlocks
    NoDrop
