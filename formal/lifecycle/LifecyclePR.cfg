\* Pull request bounds: Lifecycle.cfg with one provider event instead of two, which keeps the check inside the job's time
\* limit. Lifecycle.cfg itself runs on main and on demand.
CONSTANTS
    P0 = p0
    Providers = {p1, p2, p3}
    MaxSwaps = 3
    MaxEvents = 1
    MaxEvals = 0
    AllowDeath = FALSE
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    FinalNotReady
    GateDownWhenIdle
    NotReadyDuringSwap
    OutcomeFollowsSettled
    OneLockHolder
    NoConcurrentInit
    ShutDownAtMostOnce
    BoundNotShutDown
    StatusFollowsSdk
    ClosedCleanly
