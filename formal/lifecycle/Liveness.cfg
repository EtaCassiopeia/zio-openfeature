\* Recovery under FairSpec.  Small bounds: liveness checking is much slower than invariant checking.  No SYMMETRY: TLC's
\* liveness checking is unsound under symmetry.
CONSTANTS
    P0 = p0
    Providers = {p1, p2}
    MaxSwaps = 2
    MaxEvents = 1
    None = None

SPECIFICATION FairSpec

PROPERTIES
    SwapEnds
    ShutdownEnds
    EventsDrain
    StatusCatchesUp
    OrphansSettleOrTearDown
