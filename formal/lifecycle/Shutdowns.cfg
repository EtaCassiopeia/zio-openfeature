\* Every invariant with providers whose shutdown() throws or hangs: Behaviours is the full set here and in Witness.cfg;
\* Liveness.cfg, Lifecycle.cfg, LifecyclePR.cfg and Evaluation.cfg keep {"ok"}, since a behaviour per registration
\* multiplies their state spaces (liveness checking cannot afford even two on Liveness.cfg's bounds).
\* Small bounds, as Liveness.cfg: checked on every pull request.
CONSTANTS
    P0 = p0
    Providers = {p1, p2}
    MaxSwaps = 2
    MaxEvents = 1
    MaxEvals = 0
    AllowDeath = FALSE
    Behaviours = {"ok", "throws", "hangs"}
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    FinalNotReady
    GateDownWhenIdle
    NotReadyDuringSwap
    OutcomeFollowsSettled
    OneLockHolder
    NoConcurrentInit
    ShutDownAtMostOnce
    NoRetryAfterFailure
    TearDownOnce
    BoundNotShutDown
    StatusFollowsSdk
    ClosedCleanly
