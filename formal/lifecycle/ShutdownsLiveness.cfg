\* ShutdownEnds under FairSpec with providers whose shutdown() hangs: the teardown's bound is what makes it true.  The
\* smallest bounds that reach a hung shutdown at the teardown; liveness checking with a behaviour per registration
\* outgrows Liveness.cfg's bounds.  Checked on every pull request; mutants.py runs the hung-shutdown mutant on it.
CONSTANTS
    P0 = p0
    Providers = {p1}
    MaxSwaps = 1
    MaxEvents = 1
    MaxEvals = 0
    AllowDeath = FALSE
    Behaviours = {"ok", "hangs"}
    None = None

SPECIFICATION FairSpec

PROPERTIES
    ShutdownEnds
