\* The silent-death witness: AllowDeath lets a provider stop working without reporting it.  witness.py requires TLC to
\* report SilentDeathUndetected violated, and every other invariant to hold up to that point.
CONSTANTS
    P0 = p0
    Providers = {p1, p2}
    MaxSwaps = 2
    MaxEvents = 1
    MaxEvals = 0
    AllowDeath = TRUE
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    FinalNotReady
    GateDownWhenIdle
    NotReadyDuringSwap
    OutcomeFollowsSettled
    OneLockHolder
    NoConcurrentInit
    ShutDownAtMostOnce
    BoundNotShutDown
    StatusFollowsSdk
    ClosedCleanly
    SilentDeathUndetected
