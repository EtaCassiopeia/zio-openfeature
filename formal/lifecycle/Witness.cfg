\* The silent-death witness: AllowDeath lets a provider stop working without reporting it.  witness.py requires TLC to
\* report SilentDeathUndetected violated, and every other invariant to hold up to that point.  Behaviours stays {"ok"}:
\* the full set multiplies the two runs several times over (Shutdowns.cfg checks it, on the same bounds, once).
CONSTANTS
    P0 = p0
    Providers = {p1, p2}
    MaxSwaps = 2
    MaxEvents = 1
    MaxEvals = 0
    AllowDeath = TRUE
    Behaviours = {"ok"}
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    FinalNotReady
    GateDownWhenIdle
    NotReadyDuringSwap
    OutcomeFollowsSettled
    OneLockHolder
    NoConcurrentInit
    ShutDownAtMostOnce
    NoRetryAfterFailure
    TearDownOnce
    BoundNotShutDown
    StatusFollowsSdk
    ClosedCleanly
    SilentDeathUndetected
