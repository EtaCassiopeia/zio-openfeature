\* Three instances and no swaps: a build that timed out, a retry that replaced it, and a third build on its provider,
\* which two instances cannot reach. FailedWrapperNotAbandoned is left to Registry.cfg: at three instances it fails on
\* a shape this configuration is not for (README, Builds.cfg).
CONSTANTS
    Instances = {i1, i2, i3}
    Domains = {default, d1, d2}
    Default = default
    Providers = {p1, p2}
    MaxSwaps = 0
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    OneOwner
    SharedShutDownOnce
    RegisteredNotShutDown
    ForeignNeverShutByLibrary
    UserProviderNeverShutByLibrary
    LiveSiblingKeepsProvider
    OneInstancePerDomain
    ClosedNonOwnerKeepsSlot
    ClosedApiServesNone

PROPERTIES
    SiblingsUnaffected
    OnlyFailedBuildsEvicted
    OneInitializeAtATime
