\* Two instances, three providers, two swaps that may overlap: the shapes where a third provider is in play, on every
\* run of the tlc job. About 900k states, under a minute.
CONSTANTS
    Instances = {i1, i2}
    Domains = {default, d1, d2}
    Default = default
    Providers = {p1, p2, p3}
    MaxSwaps = 2
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    OneOwner
    SharedShutDownOnce
    RegisteredNotShutDown
    ForeignNeverShutByLibrary
    UserProviderNeverShutByLibrary
    LiveSiblingKeepsProvider
    FailedWrapperNotAbandoned
    OneInstancePerDomain
    ClosedNonOwnerKeepsSlot
    ClosedApiServesNone

PROPERTIES
    SiblingsUnaffected
    OnlyFailedBuildsEvicted
