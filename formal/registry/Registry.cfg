\* Two instances on two domains, two providers, two swaps: every ownership property, on every pull request.
CONSTANTS
    Instances = {i1, i2}
    Domains = {default, d1}
    Default = default
    Providers = {p1, p2}
    MaxSwaps = 2
    None = None

SPECIFICATION Spec
SYMMETRY ProviderSymmetry

INVARIANTS
    TypeInv
    OneOwner
    SharedShutDownOnce
    RegisteredNotShutDown
    ForeignNeverShutByLibrary
    UserProviderNeverShutByLibrary
    LiveSiblingKeepsProvider
    FailedWrapperNotAbandoned
    OneInstancePerDomain
    ClosedNonOwnerKeepsSlot

PROPERTIES
    SiblingsUnaffected
