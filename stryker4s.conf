# Mutation testing for core (#468). Run by .github/workflows/mutation.yml on a schedule; never gates a PR.
# Locally: `core/stryker` (the default Scala 3 build). The HTML report lands in core/target/stryker4s-report/.
stryker4s {
  mutate: ["src/main/scala/**/*.scala", "src/main/scala-3/**/*.scala"]
  scala-dialect: "scala3"
  reporters: ["console", "html", "json"]
  # Informational only: a low score never fails the run.
  thresholds { high: 80, low: 60, break: 0 }
  # A mutant that makes the suite hang is "timed out", not a failure of the job.
  timeout-factor: 2.0
}
