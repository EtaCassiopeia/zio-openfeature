# Mutation testing, run per module (`core/stryker`, `extras/stryker`) by .github/workflows/mutation.yml on a schedule;
# never gates a PR. The HTML and JSON reports land in <module>/target/stryker4s-report/.
stryker4s {
  mutate: ["src/main/scala/**/*.scala", "src/main/scala-3/**/*.scala"]
  scala-dialect: "scala3"
  reporters: ["console", "html", "json"]
  # `break` stays 0: each module's floor is enforced by scripts/mutation-summary.py from the JSON report, so core and
  # extras can hold different floors.
  thresholds { high: 80, low: 60, break: 0 }
  # A mutant that makes the suite hang is "timed out", not a failure of the job.
  timeout-factor: 2.0
}
